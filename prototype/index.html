<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touris 知途 · 记忆驱动的旅行规划</title>
<link rel="stylesheet" href="logo.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-extra.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="account.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="real-maps.css">
</head>
<body>

<!-- 顶栏 -->
<header class="topbar" id="topbar"></header>

<div class="shell" id="shell">
  <!-- 左栏：需求 + 记忆资产 + 本次用到的记忆 -->
  <aside class="rail-left" id="railLeft"></aside>

  <!-- 主工作区 -->
  <main class="work" id="work"></main>
</div>

<!-- 记忆溯源悬浮卡 -->
<div class="mem-pop" id="memPop" hidden></div>

<!-- toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- 数据层：语义映射 → 图片 → 记忆档案 → 城市资料 → 候选景点扩充 -->
<script src="semantics.js"></script>
<script src="images.js"></script>
<script src="data.js"></script>
<script src="city-data.js"></script>
<script src="city-expansion.js"></script>
<script src="city-hangzhou-guangzhou.js"></script>
<script src="city-chengdu.js"></script>
<script src="spots-expansion.js"></script>
<script src="coords.js"></script>
<!-- 预算数据：景点门票档位 + 住宿价位区间。必须在 city-data 之后载入——
     它要读 CITY_DATA 才能把城市名补到城市对象上。 -->
<script src="budget-data.js"></script>
<!-- 引擎：算法排线 → RAG 攻略 → LLM 客户端 → 身份 → 地图 → 界面 -->
<script src="planner.js"></script>
<script src="guides-data.js"></script>
<script src="rag.js"></script>
<script src="llm.js"></script>
<script src="account.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<!-- 底图有两条路，real-maps.js 运行时自动挑一条（选法见该文件头）：
     矢量走 tiles/*.pmtiles 归档、由 protomaps-leaflet 画进 canvas，
       需要后端支持 HTTP Range（server.js 提供）；
     拿不到 Range 就回退到 tiles-raster/*.jpg 那套预烤栅格。
     这三件套约 190KB，只在矢量那条路上真正用上；署名见 tiles/CREDITS.md。 -->
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script src="vendor/protomaps-leaflet.js"></script>
<script src="real-maps.js"></script>
<script src="app.js"></script>
</body>
</html>
