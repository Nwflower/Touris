<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touris 知途 · 离线地图渲染验证</title>
<link rel="stylesheet" href="./assets/vendor/maplibre-gl.css">
<style>
  :root { --ink:#2B2622; --ink-3:#8A8177; --line:#E2DACC; --bg:#F7F3EC; --ok:#3F7D58; --bad:#B4443A; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#fff; }
  h1 { font-size:14px; margin:0; font-weight:600; }
  .cities { display:flex; gap:6px; }
  .cities button { font:inherit; font-size:13px; padding:4px 13px; border:1px solid var(--line); background:#fff; border-radius:99px; cursor:pointer; color:var(--ink); }
  .cities button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .stats { margin-left:auto; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .warn { background:#FBEDE9; color:var(--bad); padding:8px 14px; font-size:12.5px; border-bottom:1px solid #E9CFC9; }
  #map { height:calc(100vh - 190px); min-height:340px; background:#EDE7DD; }
  .panels { display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line); background:#fff; }
  .panel { padding:10px 14px; font-size:12.5px; }
  .panel + .panel { border-left:1px solid var(--line); }
  .panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin:0 0 6px; font-weight:600; }
  .row { display:flex; gap:8px; font-variant-numeric:tabular-nums; }
  .row b { font-weight:400; min-width:64px; color:var(--ink-3); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #log { max-height:110px; overflow:auto; font-family:ui-monospace,Consolas,monospace; font-size:11.5px; line-height:1.55; white-space:pre-wrap; }
</style>
</head>
<body>

<header>
  <h1>Touris 离线地图验证</h1>
  <div class="cities" id="cities"></div>
  <div class="stats" id="stats">等待加载…</div>
</header>

<div id="filewarn" class="warn" hidden>
  当前是 <code>file://</code> 打开——module worker 和 Range 请求都不可用。请改用
  <code>node tools/tile-server.js</code> 后访问 http://127.0.0.1:8080/offline-test.html
</div>

<div id="map"></div>

<div class="panels">
  <div class="panel">
    <h2>离线资源自检</h2>
    <div id="selfcheck">检查中…</div>
  </div>
  <div class="panel">
    <h2>运行日志</h2>
    <div id="log"></div>
  </div>
</div>

<script src="./assets/vendor/pmtiles.js"></script>
<script src="./assets/vendor/basemaps.js"></script>
<script src="../tools/style-patch.js"></script>
<script type="module">
import { Map, addProtocol, NavigationControl, AttributionControl } from './assets/vendor/maplibre-gl.mjs';

const logEl = document.getElementById('log');
const log = m => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

if (location.protocol === 'file:') {
  document.getElementById('filewarn').hidden = false;
}

const CITIES = [
  { key:'kyoto',    name:'京都', file:'kyoto.pmtiles',    center:[135.775, 35.000], zoom:12 },
  { key:'beijing',  name:'北京', file:'beijing.pmtiles',  center:[116.450, 40.050], zoom:11 },
  { key:'shanghai', name:'上海', file:'shanghai.pmtiles', center:[121.425, 31.200], zoom:11 },
  { key:'chengdu',  name:'成都', file:'chengdu.pmtiles',  center:[103.950, 30.775], zoom:11 },
];

const abs = f => new URL('./' + f, location.href).href;

/* ---------------- 自检：三样东西缺一不可 ---------------- */
async function selfCheck() {
  const box = document.getElementById('selfcheck');
  // 注意：空字形分片也是 200，所以汉字那项必须查字节数，只查状态码会漏
  const bigEnough = min => async r => r.ok && (await r.arrayBuffer()).byteLength > min;
  const checks = [
    ['矢量瓦片 (Range 206)',   abs('kyoto.pmtiles'), { Range: 'bytes=0-16383' }, r => r.status === 206],
    ['字形 · 拉丁',            abs('assets/fonts/Noto%20Sans%20Regular/0-255.pbf'), {}, bigEnough(10000)],
    ['字形 · 汉字 (自生成)',   abs('assets/fonts/Noto%20Sans%20SC/19968-20223.pbf'), {}, bigEnough(1000)],
    ['字形 · 假名',            abs('assets/fonts/Noto%20Sans%20SC/12288-12543.pbf'), {}, r => r.ok],
    ['精灵图 light.json',      abs('assets/sprites/light.json'), {}, r => r.ok],
    ['精灵图 light.png',       abs('assets/sprites/light.png'), {}, r => r.ok],
  ];
  const rows = [];
  for (const [label, url, headers, ok] of checks) {
    try {
      const r = await fetch(url, { headers });
      const pass = await ok(r);
      const size = pass ? (await r.clone().arrayBuffer()).byteLength : 0;
      rows.push(`<div class="row"><b>${label}</b><span class="${pass ? 'ok' : 'bad'}">${pass ? '通过' : '失败'} (${r.status}${size ? ' · ' + size + ' B' : ''})</span></div>`);
      if (label.startsWith('矢量瓦片')) {
        log(`瓦片 Range 响应: ${r.status} ${r.headers.get('content-range') || ''}`);
      }
    } catch (e) {
      rows.push(`<div class="row"><b>${label}</b><span class="bad">异常 ${e.message}</span></div>`);
    }
  }
  box.innerHTML = rows.join('');
}
selfCheck();

/* ---------------- 地图 ---------------- */
const protocol = new pmtiles.Protocol();
const rawTile = protocol.tile.bind(protocol);

const stats = { req: 0, ok: 0, fail: 0 };
addProtocol('pmtiles', (request, controller) => {
  stats.req++;
  return rawTile(request, controller)
    .then(d => { stats.ok++; render(); return d; })
    .catch(e => { stats.fail++; log('瓦片失败: ' + e.message); render(); throw e; });
});

function render() {
  document.getElementById('stats').textContent =
    `瓦片请求 ${stats.req} · 成功 ${stats.ok} · 失败 ${stats.fail}`;
}

const style = url => {
  // lang 决定标签语言；实测传 zh-Hans 后样式里会出现 name:zh-Hans（中文优先、英文兜底）
  const layers = basemaps.layers('protomaps', basemaps.namedFlavor('light'), { lang: 'zh-Hans' });
  // Protomaps 字体不含汉字字形，追加自生成的 "Noto Sans SC" 做逐字回退
  const touched = patchFontstack({ layers });
  const uncovered = patchFontstack.verify({ layers });
  log(`样式生成：${layers.length} 图层，字体栈补丁 ${touched} 个，未覆盖 ${uncovered.length} 个`);
  if (uncovered.length) log('未覆盖图层: ' + uncovered.join(', '));

  return {
    version: 8,
    glyphs: abs('assets/fonts/{fontstack}/{range}.pbf'),
    sprite: abs('assets/sprites/light'),
    sources: {
      protomaps: {
        type: 'vector',
        url: 'pmtiles://' + url,
        attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>',
      },
    },
    layers,
  };
};

const start = CITIES[0];
const map = new Map({
  container: 'map',
  style: style(abs(start.file)),
  center: start.center,
  zoom: start.zoom,
  attributionControl: false,   // 自己加，避免默认折叠
});

map.addControl(new NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new AttributionControl({ compact: false }), 'bottom-right');

map.on('error', e => log('地图错误: ' + (e && e.error ? e.error.message : String(e))));
map.on('load', () => log('地图 load 事件已触发'));
map.on('idle', () => log(`渲染稳定：已加载 ${stats.ok} 个瓦片`));

/* ---------------- 城市切换 ---------------- */
const citiesEl = document.getElementById('cities');
let current = start.key;
CITIES.forEach(c => {
  const b = document.createElement('button');
  b.textContent = c.name;
  b.className = c.key === current ? 'on' : '';
  b.onclick = () => {
    if (c.key === current) return;
    current = c.key;
    [...citiesEl.children].forEach(x => x.classList.toggle('on', x.textContent === c.name));
    log(`--- 切换到 ${c.name} ---`);
    stats.req = stats.ok = stats.fail = 0;
    render();
    map.getSource('protomaps').setUrl('pmtiles://' + abs(c.file));
    map.setCenter(c.center);
    map.setZoom(c.zoom);
  };
  citiesEl.appendChild(b);
});

// 暴露给控制台，方便手动排查
Object.assign(window, { map, basemaps, pmtiles, stats });
</script>
</body>
</html>
